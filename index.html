<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>うちの子ライブ</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ebe3d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="うちの子">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* layout: the pet fills the screen like a room it lives in; the care buttons sit low in a soft bar, poses tuck behind a "more" toggle.
   One fixed look on purpose: the room is the same warm studio wall as the videos, in light or dark mode. #desk = the small always-on-top window on a Mac. */
:root{
  --room:#ebe3d8;            /* updated live from the video's own wall colour */
  --bar:rgba(255,252,247,.72); --bar-line:rgba(120,96,72,.16);
  --ink:#2b2520; --sub:#6f6257; --accent:#c8743d; --accent-ink:#fff;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--ink);font-family:var(--display);overflow:hidden;transition:background-color 1.2s linear;user-select:none;-webkit-user-select:none}
.stage{position:fixed;inset:0;cursor:pointer;outline:none}
.hani{position:absolute;left:50%;top:54%;width:min(100vw,74svh);aspect-ratio:1/1;max-width:100%;transform:translate(-50%,-50%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 86%,transparent 100%),linear-gradient(to right,transparent 0,#000 9%,#000 91%,transparent 100%);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 86%,transparent 100%),linear-gradient(to right,transparent 0,#000 9%,#000 91%,transparent 100%);mask-composite:intersect}
@media (max-aspect-ratio: 3/4){ .hani{ -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 86%,transparent 100%); mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 86%,transparent 100%) } }
.hani video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .18s linear;pointer-events:none}
.hani video.top{z-index:2}
.hani video.shown{opacity:1}
.tag{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;background:var(--bar);border:1px solid var(--bar-line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;pointer-events:none}
.loading{position:fixed;z-index:6;inset:0;display:grid;place-items:center;color:var(--sub);font-size:15px;background:var(--room)}
.loading[hidden]{display:none}
.dock{position:fixed;z-index:5;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(calc(100vw - 32px),460px);display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;padding:8px;background:var(--bar);border:1px solid var(--bar-line);border-radius:22px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.row button{flex:1;min-width:0;border:0;border-radius:16px;padding:12px 4px;background:transparent;color:var(--ink);font-family:var(--display);font-weight:700;font-size:15px;cursor:pointer}
.row button:active{background:rgba(200,116,61,.14)}
.row button.on{background:var(--accent);color:var(--accent-ink)}
.row button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row.more{font-size:14px}
.row.more button{font-size:13px;padding:10px 0;white-space:nowrap;letter-spacing:-.02em}
.row.more[hidden]{display:none}
#bMore{flex:0 0 52px;font-size:18px;letter-spacing:1px}
@media (prefers-reduced-motion: reduce){ .hani video{transition:none} body{transition:none} }

/* the Mac desk window: only Hani, controls appear on hover */
body.desk .hani{top:50%;width:100vw;max-width:none;-webkit-mask-image:radial-gradient(closest-side,#000 78%,transparent 100%);mask-image:radial-gradient(closest-side,#000 78%,transparent 100%)}
body.desk .tag,body.desk .dock{display:none}
.deskmenu{display:none}
body.desk .deskmenu{display:block;position:fixed;z-index:6;right:8px;bottom:8px}
.deskmenu .open{width:30px;height:30px;border-radius:50%;border:1px solid var(--bar-line);background:var(--bar);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  color:var(--ink);font-size:14px;line-height:1;cursor:pointer;opacity:0;transition:opacity .2s}
body.desk:hover .deskmenu .open,.deskmenu .open[aria-expanded="true"]{opacity:1}
.deskmenu .list{position:absolute;right:0;bottom:36px;display:flex;flex-direction:column;min-width:112px;padding:4px;border-radius:12px;background:var(--bar);border:1px solid var(--bar-line);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 6px 18px rgba(60,40,20,.18)}
.deskmenu .list[hidden]{display:none}
.deskmenu .list button{border:0;background:transparent;color:var(--ink);font-family:var(--display);font-weight:700;font-size:12px;text-align:left;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.deskmenu .list button:hover{background:rgba(200,116,61,.16)}
.deskmenu .list hr{border:0;border-top:1px solid var(--bar-line);margin:3px 6px}

/* the shelf: choose which pet lives here (public samples, or a private one by its code) */
.shelf{position:fixed;z-index:7;inset:0;overflow:auto;background:var(--room);padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 28px)}
.shelf[hidden]{display:none}
.shelf .in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.shelf h1{font-size:24px;margin:0}
.shelf h2{font-size:15px;margin:0 0 10px;color:var(--sub)}
.shelf p{margin:0;color:var(--sub);font-size:14px;line-height:1.6}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border-radius:18px;border:1px solid var(--bar-line);background:var(--bar);font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink);cursor:pointer}
.card img{width:88px;height:88px;border-radius:24px;object-fit:cover}
.code{display:flex;gap:8px}
.code input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--bar-line);background:#fffdf9;color:var(--ink)}
.code button{border:0;border-radius:14px;padding:0 18px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:15px;cursor:pointer}
.code input:focus-visible,.code button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:#a6402a;font-size:14px;min-height:1.4em}

/* #pet = the desktop pet on a Mac: no room, no frame, just the animal on the desktop (clips have transparent backgrounds) */
html.petmode,body.petmode{background:transparent!important}
body.petmode .hani{top:50%;width:100vw;max-width:none;-webkit-mask-image:none;mask-image:none}
body.petmode .tag,body.petmode .dock,body.petmode .loading{display:none}
body.petmode .deskmenu{display:block;position:fixed;z-index:6;right:4px;bottom:4px}
body.petmode:hover .deskmenu .open{opacity:1}
body.petmode .stage{cursor:grab}
</style>

<div class="stage" id="stage" tabindex="0" role="button" aria-label="なでる・呼ぶ">
  <div class="hani">
    <video id="vA" muted playsinline preload="auto"></video>
    <video id="vB" muted playsinline preload="auto"></video>
  </div>
</div>
<div class="tag" id="tag"></div>
<div class="dock">
  <div class="row more" id="more" hidden></div>
  <div class="row" id="careRow"></div>
</div>
<div class="deskmenu" id="deskmenu">
  <div class="list" id="deskList" hidden></div>
  <button class="open" id="bDeskMenu" aria-expanded="false" aria-controls="deskList" aria-label="メニュー">≡</button>
</div>
<div class="loading" id="loading" hidden>呼んでいます…</div>

<section class="shelf" id="shelf" hidden>
  <div class="in">
    <div>
      <h1>うちの子ライブ</h1>
      <p>スマホの中で暮らす子を迎えます。</p>
    </div>
    <div id="mineBox" hidden>
      <h2>うちの子</h2>
      <div class="cards" id="mine"></div>
    </div>
    <div>
      <h2>みんなの棚</h2>
      <div class="cards" id="cards"></div>
      <p id="noCards" hidden>準備中です。</p>
    </div>
    <div>
      <h2>コードで迎える</h2>
      <p>迎え入れコードをもらった人は、ここに入れてください。</p>
      <form class="code" id="codeForm" autocomplete="off">
        <input id="codeInput" aria-label="迎え入れコード" placeholder="迎え入れコード" autocapitalize="off" spellcheck="false">
        <button type="submit">迎える</button>
      </form>
      <div class="err" id="codeErr" role="status"></div>
    </div>
  </div>
</section>

<script>
(function(){
/* ---------- which pet lives here ----------
   A pet is a folder pets/<id>/ with pet.json + clips/. Public pets are listed in pets/catalog.json;
   private ones are not listed and are opened by their code (the folder id). Every pet adopted here is remembered,
   so going back to the shelf never loses a code. */
const params=new URLSearchParams(location.search);
const desk=location.hash==="#desk";
const petMode=location.hash==="#pet";
if(desk)document.body.classList.add("desk");
if(petMode){document.body.classList.add("petmode");document.documentElement.classList.add("petmode");}
/* the desktop pet uses transparent-background clips (.mov, HEVC with alpha) */
const CLIP_EXT=params.get("fmt")==="mov"?".mov":".mp4";
/* talk to the native app that hosts the page (Mac desktop pet / iPhone); does nothing in a browser */
const native=msg=>{try{window.webkit.messageHandlers.uchinoko.postMessage(msg);}catch(_){}};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(_){return d}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));}catch(_){}}};
const CUR="uchinoko.current", ADOPTED="uchinoko.adopted";
const $=id=>document.getElementById(id);
const stage=$("stage"),tag=$("tag"),loading=$("loading"),shelf=$("shelf");
const layers=[$("vA"),$("vB")];
const rnd=(a,b)=>a+Math.random()*(b-a);
const now=()=>Date.now();
const isNight=()=>{const h=new Date().getHours();return h>=22||h<6;};
const weighted=(items,w=x=>x.weight)=>{const total=items.reduce((s,x)=>s+w(x),0);let r=Math.random()*total;for(const x of items){r-=w(x);if(r<0)return x;}return items[items.length-1];};
const validId=id=>/^[a-z0-9][a-z0-9-]{2,40}$/.test(id||"");

async function loadPet(id){
  if(!validId(id))throw new Error("bad id");
  /* native apps open the page from disk, where fetch() cannot read files; they hand the pet over themselves */
  const given=window.__UCHINOKO_PETS__&&window.__UCHINOKO_PETS__[id];
  if(given)return Object.assign({},given,{base:"pets/"+id+"/"});
  const r=await fetch("pets/"+id+"/pet.json",{cache:"no-cache"});
  if(!r.ok)throw new Error("not found");
  const pet=await r.json();pet.base="pets/"+id+"/";return pet;
}
function remember(pet){
  ls.set(CUR,pet.id);
  const list=ls.get(ADOPTED,[]).filter(x=>x.id!==pet.id);
  list.unshift({id:pet.id,name:pet.name,icon:pet.icon||"icon-180.png"});ls.set(ADOPTED,list);
}

/* ---------- the shelf ---------- */
function card(it){
  const b=document.createElement("button");b.className="card";b.type="button";
  const img=document.createElement("img");img.alt="";img.src="pets/"+it.id+"/"+(it.icon||"icon-180.png");
  b.append(img,document.createTextNode(it.name));b.onclick=()=>adopt(it.id);return b;
}
async function showShelf(){
  shelf.hidden=false;loading.hidden=true;
  const mine=ls.get(ADOPTED,[]);
  $("mineBox").hidden=!mine.length;$("mine").replaceChildren(...mine.map(card));
  let list=[];
  try{const r=await fetch("pets/catalog.json",{cache:"no-cache"});if(r.ok)list=(await r.json()).public||[];}catch(_){}
  $("noCards").hidden=list.length>0;$("cards").replaceChildren(...list.map(card));
}
async function adopt(id){
  $("codeErr").textContent="";
  try{const pet=await loadPet(id);remember(pet);shelf.hidden=true;start(pet);}
  catch(_){ $("codeErr").textContent="その子が見つかりませんでした。コードをもう一度確かめてください。"; }
}
$("codeForm").addEventListener("submit",e=>{e.preventDefault();adopt($("codeInput").value.trim().toLowerCase());});

/* ---------- mood ----------
   Three feelings that drift with time and settle with care. They only nudge what the pet chooses to do next;
   nothing bad ever happens from being left alone (no sickness, no leaving, no blame). */
const MOOD_DEFAULT={lonelyMinutes:30,hungryHours:6,thirstyHours:3,lonelyLabel:"かまって？",hungryLabel:"おなかすいた…",thirstyLabel:"のどかわいた…",greetLabel:"おかえり",greetAfterHours:3};
let M=null, mood=null;
const moodKey=()=>"uchinoko.mood."+P.id;
function loadMood(){const t=now();mood=Object.assign({touch:t,treat:t,water:t,pets:[]},ls.get(moodKey(),{}));}
function saveMood(){ls.set(moodKey(),mood);native({type:"mood",touch:mood.touch,treat:mood.treat,water:mood.water,pose});}
const clamp01=x=>Math.max(0,Math.min(1,x));
const lonely=()=>clamp01((now()-mood.touch)/(M.lonelyMinutes*60e3));
const hungry=()=>clamp01((now()-mood.treat)/(M.hungryHours*3600e3));
const thirsty=()=>clamp01((now()-mood.water)/(M.thirstyHours*3600e3));
function cared(id){
  const t=now();mood.touch=t;
  const c=P.care.find(x=>x.id===id);
  if(c&&c.settles){for(const k of c.settles)mood[k]=t;}
  if(id==="pet"){mood.pets=mood.pets.filter(x=>t-x<10*60e3).concat(t);}
  saveMood();
}
function touched(){mood.touch=now();saveMood();}

/* ---------- the living pet ---------- */
let P=null, URL_OF={}, EDGES={};
let greet=false, gen=0, front=0, pose="", moving=null, queue=[], idleCount=0, called=false, lastIdle="", resting=false, wake=null, nextLabel="";

function setupUI(){
  document.title=P.name;
  stage.setAttribute("aria-label",P.name+"をなでる・呼ぶ");
  const mk=(label,fn,attrs)=>{const b=document.createElement("button");b.type="button";b.textContent=label;b.onclick=e=>{e.stopPropagation();fn();};if(attrs)for(const k in attrs)b.dataset[k]=attrs[k];return b;};
  const poseBtns=()=>Object.entries(P.poses).map(([k,v])=>mk(v.button,()=>{touched();request(k);},{pose:k}));
  const careBtns=()=>P.care.map(c=>mk(c.button,()=>doCare(c.id)));
  const callBtn=()=>mk(P.call.button,call);
  const shelfBtn=()=>mk("ほかの子",()=>{location.href=location.pathname+"?shelf=1"+(desk?"#desk":"");});
  const showShelfBtn=!params.get("pet")&&!onlyPet;
  const more=$("more");more.replaceChildren(...poseBtns(),callBtn(),...(showShelfBtn?[shelfBtn()]:[]));
  const bMore=mk("…",()=>{more.hidden=!more.hidden;bMore.setAttribute("aria-expanded",String(!more.hidden));});
  bMore.id="bMore";bMore.setAttribute("aria-expanded","false");bMore.setAttribute("aria-label","姿勢を頼む");
  $("careRow").replaceChildren(...careBtns(),bMore);
  $("deskList").replaceChildren(...careBtns(),document.createElement("hr"),...poseBtns(),callBtn(),...(showShelfBtn?[document.createElement("hr"),shelfBtn()]:[]));
}

function clipNames(){
  const names=new Set();
  for(const v of Object.values(P.poses))v.idles.forEach(i=>names.add(i.clip));
  P.transitions.forEach(t=>names.add(t.clip));
  P.care.forEach(c=>c.outcomes.forEach(o=>names.add(o.clip)));
  return [...names];
}
function preload(){
  const src=n=>P.base+"clips/"+n+CLIP_EXT;
  const names=clipNames();
  /* keep every clip in memory so switching never waits on the network; opened from disk (native apps), play straight from the files.
     A clip that fails to load is simply skipped later. */
  return Promise.all(names.map(n=>fetch(src(n)).then(r=>{if(!r.ok)throw 0;return r.blob();}).then(b=>{URL_OF[n]=URL.createObjectURL(b);}).catch(()=>{URL_OF[n]=src(n);})));
}

/* play a clip on the back layer and fade it over the front one. Always settles: on end, on error, or by a watchdog,
   and right away when interrupted (stopPlay), so the life loop can never hang on one clip. */
let stopPlay=null;
function play(name){
  const next=layers[1-front], cur=layers[front];
  return new Promise(res=>{
    let done=false, guard=0;
    const finish=ok=>{if(done)return;done=true;clearTimeout(guard);next.onloadeddata=next.onended=next.onerror=null;stopPlay=null;res(ok);};
    stopPlay=()=>{next.pause();finish(false);};
    if(!URL_OF[name]){finish(false);return;}
    guard=setTimeout(()=>finish(false),5000);           // never started
    next.onerror=()=>finish(false);
    /* iPhone's WebKit does not load a video until it is asked to play, so ask right away and reveal it once frames arrive */
    next.onloadeddata=()=>{
      next.onloadeddata=null;
      next.classList.add("top","shown"); cur.classList.remove("top");
      setTimeout(()=>{cur.classList.remove("shown");cur.pause();},220);
      front=1-front;
      clearTimeout(guard);guard=setTimeout(()=>finish(true),((next.duration||10)+4)*1000);  // stalled midway
    };
    next.onended=()=>finish(true);
    next.src=URL_OF[name];
    const p=next.play(); if(p&&p.catch)p.catch(()=>{});
  });
}
/* a pause that a request can cut short */
function rest(ms){return new Promise(res=>{resting=true;const t=setTimeout(()=>{resting=false;wake=null;res();},ms);wake=()=>{clearTimeout(t);resting=false;wake=null;res();};});}

/* shortest path between poses, as a list of transition clips */
function path(from,to){
  if(from===to)return [];
  const prev={[from]:null},q=[from];
  while(q.length){const p=q.shift();for(const n in (EDGES[p]||{})){if(!(n in prev)){prev[n]=p;q.push(n);}}}
  if(!(to in prev))return [];
  const out=[];let n=to;while(prev[n]!==null){out.unshift({clip:EDGES[prev[n]][n],to:n});n=prev[n];}
  return out;
}

/* what to do after an idle: the pet's own odds, nudged by how it feels */
function choose(){
  const pp=P.poses[pose];
  const lon=lonely(), hun=hungry(), thi=thirsty();
  // wants company: come up and look for you (not in the middle of the night)
  if(lon>0.7&&!isNight()&&pose!==P.call.pose&&Math.random()<0.35){nextLabel=M.lonelyLabel;return P.call.pose;}
  const careOf=id=>P.care.find(c=>c.id===id);
  if(hun>0.8&&careOf("treat")&&Math.random()<0.25){const to=careOf("treat").pose;if(to!==pose){nextLabel=M.hungryLabel;return to;}}
  if(thi>0.8&&careOf("water")&&Math.random()<0.25){const to=careOf("water").pose;if(to!==pose){nextLabel=M.thirstyLabel;return to;}}
  // lonely pets do not settle into long naps
  const stay=pp.stayIdles?[lon>0.7?1:pp.stayIdles[0],lon>0.7?2:pp.stayIdles[1]]:null;
  if(stay&&idleCount<rnd(stay[0],stay[1]))return null;
  const odds=(isNight()&&pp.nightNext)||pp.next;
  const pick=weighted(Object.entries(odds),([,w])=>w)[0];
  return pick==="stay"?null:pick;
}
/* the plain idle (first) comes up by its weight; the habits fill the rest and never repeat back to back */
function pickIdle(p){
  const list=P.poses[p].idles.filter((x,i)=>i===0||x.clip!==lastIdle);
  const pick=weighted(list);lastIdle=pick.clip;return pick;
}
/* how a care goes also depends on mood: a lonely pet melts into petting, one petted again and again starts ducking away */
function careClip(id){
  const c=P.care.find(x=>x.id===id);
  if(id!=="pet")return weighted(c.outcomes);
  const recent=mood.pets.filter(x=>now()-x<10*60e3).length, lon=lonely();
  return weighted(c.outcomes,o=>{
    const avoid=/dodge|いや/.test(o.clip+o.label);
    return o.weight*(avoid?(recent>=3?2.5:1)*(lon>0.6?0.5:1):(lon>0.6?1.5:1));
  });
}
function markButtons(){document.querySelectorAll("[data-pose]").forEach(b=>b.classList.toggle("on",b.dataset.pose===pose));}
function idleLabel(idle){
  if(greet){greet=false;return M.greetLabel;}
  if(idle.label)return idle.label;
  const pp=P.poses[pose];
  if(hungry()>0.8&&P.care.some(c=>c.id==="treat"&&c.pose===pose))return M.hungryLabel;
  if(thirsty()>0.8&&P.care.some(c=>c.id==="water"&&c.pose===pose))return M.thirstyLabel;
  if(lonely()>0.7&&pose===P.call.pose&&!isNight())return M.lonelyLabel;
  return (isNight()&&pp.nightLabel)||pp.label;
}

/* the life loop: one at a time, numbered (gen). A request starts a new loop and the old one quietly ends. */
async function live(g){
  while(g===gen){
    if(queue.length){
      const s=queue.shift();
      tag.textContent=s.label||nextLabel||(s.to===P.call.pose&&called?P.call.label:(P.poses[s.to].arriveLabel||P.movingLabel));
      nextLabel="";
      moving=s.to; await play(s.clip); if(g!==gen)return;
      pose=s.to; moving=null; idleCount=0; markButtons(); native({type:"pose",pose});
      continue;
    }
    if(called&&pose===P.call.pose)called=false;
    /* after a pose change, always spend at least one idle in the new pose */
    const next=idleCount===0?null:choose();
    if(next){const q=path(pose,next);if(q.length){queue=q;continue;}}
    nextLabel="";
    const idle=pickIdle(pose);
    tag.textContent=idleLabel(idle);
    idleCount++;
    const ok=await play(idle.clip); if(g!==gen)return;
    if(!ok)await rest(800);   // a missing clip: wait a beat instead of spinning
    if(g!==gen)return;
    /* sometimes just stay still for a moment, like a real animal */
    if(!queue.length&&!P.poses[pose].noHold&&Math.random()<(P.holdChance||0)){await rest(rnd(1200,3500));}
  }
}
function restart(){gen++;if(stopPlay)stopPlay();if(wake)wake();live(gen);}

/* a request interrupts a calm idle or pause right away; a pose change already underway finishes first, then the new plan runs */
function request(to,care){
  const q=path(moving||pose,to);
  if(care){const o=careClip(care);q.push({clip:o.clip,to,label:o.label});}
  if(!q.length)return;
  queue=q;
  if(moving)return;
  restart();
}
function doCare(id){const c=P.care.find(x=>x.id===id);if(!c)return;called=false;cared(id);request(c.pose,c.id);}
function call(){called=true;touched();tag.textContent=P.call.label;request(P.call.pose);}
/* tapping does what the pet's own table says for the pose it is in */
function tap(){
  if(!P||moving)return;
  const act=P.tap[pose]||P.tap["*"];
  if(act==="call")call();else doCare(act);
}
if(!petMode)stage.addEventListener("click",tap);
/* the desktop pet: press and move to carry it (the Mac app moves the window); a press without moving is a tap */
if(petMode){
  let down=null,dragging=false;
  stage.addEventListener("pointerdown",e=>{down={x:e.screenX,y:e.screenY};dragging=false;stage.setPointerCapture(e.pointerId);});
  stage.addEventListener("pointermove",e=>{
    if(!down)return;
    const dx=e.screenX-down.x,dy=e.screenY-down.y;
    if(!dragging&&Math.hypot(dx,dy)<4)return;
    dragging=true;native({type:"drag",dx,dy});down={x:e.screenX,y:e.screenY};
  });
  stage.addEventListener("pointerup",()=>{if(!down)return;if(dragging){native({type:"drop"});touched();}else tap();down=null;dragging=false;});
}
stage.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tap();}});

/* the Mac desk window: a menu button on hover; choosing anything closes the list again */
const deskList=$("deskList"),bDesk=$("bDeskMenu");
const setDesk=open=>{deskList.hidden=!open;bDesk.setAttribute("aria-expanded",String(open));};
bDesk.onclick=e=>{e.stopPropagation();setDesk(deskList.hidden);};
deskList.addEventListener("click",()=>setDesk(false),true);  // capture: the buttons stop the click from bubbling
document.addEventListener("mouseleave",()=>setDesk(false));

/* browsers pause muted video that scrolls out of view or sits in a background tab; resume it so the chain of clips never stalls */
function resume(){const v=layers[front];if(v.src&&v.paused&&!v.ended){const p=v.play();if(p&&p.catch)p.catch(()=>{});}}
setInterval(resume,1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)resume();});

/* the room takes the colour of the wall behind the pet in the current clip, so the video's edge disappears */
const probe=document.createElement("canvas");probe.width=probe.height=1;
const pctx=probe.getContext("2d",{willReadFrequently:true});
function matchRoom(){
  const v=layers[front];if(!v.videoWidth)return;
  try{pctx.drawImage(v,v.videoWidth*0.02,v.videoHeight*0.04,v.videoWidth*0.06,v.videoHeight*0.06,0,0,1,1);
    const d=pctx.getImageData(0,0,1,1).data;document.documentElement.style.setProperty("--room",`rgb(${d[0]},${d[1]},${d[2]})`);}catch(_){}
}
if(!petMode)setInterval(matchRoom,1500);

/* keep the screen on while the pet is shown (a dedicated device on a stand), where the browser allows it */
async function keepAwake(){try{if("wakeLock" in navigator&&!document.hidden)await navigator.wakeLock.request("screen");}catch(_){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&P)keepAwake();});

/* native apps (menu bar item, widget buttons) call these */
window.uchinoko={care:id=>P&&doCare(id),pose:p=>{if(P&&P.poses[p]){touched();request(p);}},call:()=>P&&call(),
  mood:()=>P&&({lonely:lonely(),hungry:hungry(),thirsty:thirsty(),pose})};

async function start(pet){
  P=pet;M=Object.assign({},MOOD_DEFAULT,P.mood||{});EDGES={};
  P.transitions.forEach(t=>{(EDGES[t.from]=EDGES[t.from]||{})[t.to]=t.clip;});
  if(!P.poses[P.start])P.start=Object.keys(P.poses)[0];
  pose=P.start;loading.textContent=P.name+"を呼んでいます…";loading.hidden=false;
  loadMood();
  setupUI();
  await preload();
  loading.hidden=true;markButtons();
  /* back after a long while: the pet gets up to greet you */
  const away=now()-mood.touch;
  if(away>M.greetAfterHours*3600e3&&!isNight()){const q=path(pose,P.call.pose);if(q.length){q[q.length-1].label=M.greetLabel;queue=q;}else greet=true;}
  touched();
  restart();keepAwake();
  native({type:"ready",name:P.name,care:P.care.map(c=>[c.id,c.button]),poses:Object.entries(P.poses).map(([k,v])=>[k,v.button]),call:P.call.button});
}

/* boot: ?pet=<id> (native apps, or a link) wins, then the site's own pet (catalog.json "only": a site that shows one pet
   and no shelf, like the browser sample), then the pet last here; ?shelf=1 or nothing remembered opens the shelf */
let onlyPet=null;
(async()=>{
  try{const r=await fetch("pets/catalog.json",{cache:"no-cache"});if(r.ok)onlyPet=(await r.json()).only||null;}catch(_){}
  const id=params.get("pet")||onlyPet||(params.get("shelf")?null:ls.get(CUR,null));
  if(id){try{const pet=await loadPet(id);if(!onlyPet)remember(pet);return start(pet);}catch(_){}}
  showShelf();
})();
})();
</script>
